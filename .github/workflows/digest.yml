name: UK Morning Digest

on:
  schedule:
    - cron: '0 6 * * *'   # 09:00 Kyiv (UTC+3); GitHub delay ~15 min → arrives ~09:15-09:30
  workflow_dispatch:

permissions:
  contents: write          # needed to push used.json back to repo

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --break-system-packages google-genai feedparser requests yfinance

      - run: python send_digest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

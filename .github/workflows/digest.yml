name: UK Morning Digest

# Основний запуск: cron-job.org о 08:00 за Києвом викликає workflow_dispatch через GitHub API
#   (GitHub-овий schedule на безкоштовному тарифі запізнюється на 6-8 годин).
# Резерв: schedule нижче. Якщо ранковий запуск уже відправив дайджест,
#   резервний просто завершиться (перевірка last_sent у used.json).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'normal — всім підписникам (раз на день); test — тільки тобі, без збереження історії'
        type: choice
        options: [normal, test]
        default: normal

permissions:
  contents: write          # щоб зберігати used.json назад у репозиторій

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install google-genai feedparser requests yfinance

      - run: python send_digest.py
        env:
          MODE: ${{ inputs.mode || 'normal' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

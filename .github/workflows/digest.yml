name: UK Morning Digest

on:
  schedule:
    - cron: '0 23 * * *'  # 23:00 UTC prev day = 02:00 Kyiv; GitHub delay up to 6h → arrives by 08:00 Kyiv worst case
  workflow_dispatch:

permissions:
  contents: write          # needed to push used.json back to repo

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --break-system-packages google-genai feedparser requests yfinance

      - run: python send_digest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
